[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-resolve"
version = "1.0.0"
description = "Autonomous Customer Support & Financial Settlement Engine with LangGraph and HITL Governance"
authors = [
    {name = "Yash Pratap Singh Tanwar", email = "yashpstanwar@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "pydantic>=2.6.0",
    "langgraph>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "api/index.py"
